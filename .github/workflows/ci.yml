name: Verificación de la migración

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run verify:assets
      - run: npm audit --audit-level=moderate
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Firestore y Cloud Storage emulados
        run: |
          npx --yes firebase-tools@15.36.0 emulators:exec --only firestore,storage --project demo-dispensador 'npm run test:emulator'
      - name: Pruebas de referencia y perfil eléctrico
        run: |
          python3 -m unittest discover -s scripts/legacy/backend/tests -v
          python3 -m unittest discover -s hardware/Documentation/wiring/tests -v
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ['2.0.17', '3.0.7']
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: make -C firmware/ESP32/test_host
      - run: python3 -m pip install pyserial
      - name: Instalar toolchain ESP32
        env:
          ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install esp32:esp32@${{ matrix.core }} --additional-urls "$ESP32_INDEX"
          arduino-cli lib install ArduinoJson@7.4.2
      - run: arduino-cli compile --fqbn esp32:esp32:esp32doit-devkit-v1 --warnings all firmware/ESP32/Dispensador_ESP32
      - run: arduino-cli compile --fqbn 'esp32:esp32:esp32cam:PartitionScheme=huge_app' --warnings all firmware/ESP32_CAM/Camara_ESP32CAM
  mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy trimesh manifold3d matplotlib
      - run: python scripts/verify-mechanics.py
  vision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardware/OpenCV
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Prueba MobileNetV2 con conjunto de referencia
        run: |
          python descargar_modelo.py
          python tests/descargar_imagenes_prueba.py imagenes_prueba
          DISPENSADOR_IMAGENES_PRUEBA=imagenes_prueba python -m unittest tests.test_modelo_real -v
